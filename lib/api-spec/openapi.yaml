openapi: 3.1.0
info:
  title: api
  version: 1.0.0
  description: EngineeringOS - Autonomous AI Engineering Platform API

# PR-02: Global security default — all /api/* routes require a valid Clerk
# session unless an operation explicitly overrides with `security: []`.
# This ensures new routes are protected by default without having to remember
# to add a per-operation security declaration.
security:
  - ClerkSession: []

paths:
  /api/healthz:
    get:
      operationId: getHealth
      summary: Health check
      tags: [Health]
      # PR-02: Public — no Clerk session required. The deployment platform's
      # health probe and uptime monitors hit this without any auth cookie.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Projects ────────────────────────────────────────────────────────────────
  /api/projects:
    get:
      operationId: listProjects
      summary: List all projects
      tags: [Projects]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      summary: Register a new project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /api/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project by ID
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    patch:
      operationId: updateProject
      summary: Update project config
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      summary: Delete a project
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /api/projects/{projectId}/scan:
    post:
      operationId: scanProject
      summary: Enqueue a project scan (runs in the background; poll the returned job)
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Scan job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"

  /api/projects/{projectId}/scan-jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Get the status/result of a background scan job
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"

  /api/projects/{projectId}/summary:
    get:
      operationId: getProjectSummary
      summary: Get project quality summary (scores, task counts, recent events)
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"

  # ─── Tasks ───────────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks with optional filters
      tags: [Tasks]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get task by ID
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    patch:
      operationId: updateTask
      summary: Update task status or fields
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      summary: Delete a task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /api/tasks/{taskId}/execute:
    post:
      operationId: executeTask
      summary: Execute a task through the AI pipeline
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Task execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      summary: Retry a failed task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Task queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}/rollback:
    post:
      operationId: rollbackTask
      summary: Roll back a task's changes
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /api/tasks/{taskId}/logs:
    get:
      operationId: getTaskLogs
      summary: Get execution logs for a task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskLog"

  # ─── Rules ───────────────────────────────────────────────────────────────────
  /api/rules:
    get:
      operationId: listRules
      summary: List all rules
      tags: [Rules]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/RuleSeverity"
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a new rule
      tags: [Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  /api/rules/{ruleId}:
    get:
      operationId: getRule
      summary: Get rule by ID
      tags: [Rules]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
    patch:
      operationId: updateRule
      summary: Update a rule
      tags: [Rules]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
    delete:
      operationId: deleteRule
      summary: Delete a rule
      tags: [Rules]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /api/rules/{ruleId}/evaluate:
    post:
      operationId: evaluateRule
      summary: Run rule evaluation against a project
      tags: [Rules]
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRuleRequest"
      responses:
        "200":
          description: Rule evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEvaluationResult"

  # ─── Workflows ────────────────────────────────────────────────────────────────
  /api/workflows:
    get:
      operationId: listWorkflows
      summary: List workflow definitions
      tags: [Workflows]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      summary: Create a workflow definition
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowInput"
      responses:
        "201":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"

  /api/workflows/{workflowId}:
    get:
      operationId: getWorkflow
      summary: Get workflow by ID
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /api/workflows/{workflowId}/start:
    post:
      operationId: startWorkflow
      summary: Start a workflow execution
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Workflow started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"

  /api/workflows/{workflowId}/stop:
    post:
      operationId: stopWorkflow
      summary: Stop an active workflow execution
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"

  /api/workflows/{workflowId}/executions:
    get:
      operationId: listWorkflowExecutions
      summary: List past executions of a workflow
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowExecution"

  /api/workflows/{workflowId}/advance:
    post:
      operationId: advanceWorkflow
      summary: Advance the running execution to its next phase (or complete it if on the last phase)
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "404":
          description: Workflow not found
        "409":
          description: No running execution to advance, or a concurrent state change

  /api/workflows/{workflowId}/fail-phase:
    post:
      operationId: failWorkflowPhase
      summary: Mark the running execution's current phase as failed
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailWorkflowPhaseInput"
      responses:
        "200":
          description: Execution marked failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "404":
          description: Workflow not found
        "409":
          description: No running execution to fail, or a concurrent state change

  /api/workflows/{workflowId}/executions/{executionId}/retry-phase:
    post:
      operationId: retryWorkflowPhase
      summary: Retry a failed execution's current phase in place
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Execution retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "404":
          description: Workflow or execution not found
        "409":
          description: Execution is not in a failed state

  /api/workflows/{workflowId}/executions/{executionId}/rollback-phase:
    post:
      operationId: rollbackWorkflowPhase
      summary: Roll a workflow execution back to a previously completed phase
      tags: [Workflows]
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: executionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackWorkflowPhaseInput"
      responses:
        "200":
          description: Execution rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "400":
          description: Target phase is missing
        "404":
          description: Workflow or execution not found
        "409":
          description: Target phase is invalid or execution state changed

  # ─── Events ──────────────────────────────────────────────────────────────────
  /api/events:
    get:
      operationId: listEvents
      summary: List system events for one project or all owned projects
      tags: [Events]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Number of events to return per page.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: One-based page number, ordered newest first.
        - name: correlationId
          in: query
          schema:
            type: string
          description: Return only events belonging to one logical operation.
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error, success]
          description: Return only events with this severity.
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive text search across message, type, and operation.
      responses:
        "200":
          description: A bounded page of matching events and the total matching count
          content:
            application/json:
              schema:
                type: object
                required: [events, total]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of events matching the filters, before pagination.

  # ─── Metrics ─────────────────────────────────────────────────────────────────
  /api/metrics:
    get:
      operationId: listMetrics
      summary: Get time-series quality metrics
      tags: [Metrics]
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Metrics time series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricRecord"

  /api/metrics/latest:
    get:
      operationId: getLatestMetrics
      summary: Get the latest metric record per project
      tags: [Metrics]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Latest metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricRecord"

  # ─── Knowledge Graph ─────────────────────────────────────────────────────────
  /api/graph/entities:
    get:
      operationId: listGraphEntities
      summary: List knowledge graph entities
      tags: [KnowledgeGraph]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/EntityType"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphEntityList"

  /api/graph/relationships:
    get:
      operationId: listGraphRelationships
      summary: List knowledge graph relationships
      tags: [KnowledgeGraph]
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
        - name: sourceId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: List of relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphRelationshipList"

  /api/graph/impact:
    get:
      operationId: getGraphEntityImpact
      summary: Compute the transitive downstream impact of an entity
      tags: [KnowledgeGraph]
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
        - name: maxDepth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
            default: 4
      responses:
        "200":
          description: Impact analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphImpactResult"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/graph/path:
    get:
      operationId: getGraphPath
      summary: Find the shortest directed path between two graph entities
      tags: [KnowledgeGraph]
      parameters:
        - name: fromId
          in: query
          required: true
          schema:
            type: string
        - name: toId
          in: query
          required: true
          schema:
            type: string
        - name: maxDepth
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Path result (found or not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphPathResult"

  /api/graph/summary/{projectId}:
    get:
      operationId: getGraphSummary
      summary: Get aggregated knowledge graph statistics for a project
      tags: [KnowledgeGraph]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Graph summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSummary"

  /api/graph/entities/{entityId}/neighbors:
    get:
      operationId: getGraphEntityNeighbors
      summary: Get a graph entity's direct incoming and outgoing relationships plus neighboring entities
      tags: [KnowledgeGraph]
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The entity, its direct relationships, and neighboring entities
          content:
            application/json:
              schema:
                type: object
                required: [entity, outgoing, incoming, neighbors]
                properties:
                  entity:
                    $ref: "#/components/schemas/GraphEntity"
                  outgoing:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphRelationship"
                  incoming:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphRelationship"
                  neighbors:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphEntity"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/graph/subgraph:
    get:
      operationId: getGraphSubgraph
      summary: Get a filtered, layered view of the knowledge graph for a project
      tags: [KnowledgeGraph]
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: relationType
          in: query
          schema:
            type: string
        - name: minConfidence
          in: query
          schema:
            type: number
            format: float
        - name: sourceType
          in: query
          schema:
            type: string
        - name: semanticTag
          in: query
          schema:
            type: string
        - name: observedOnly
          in: query
          schema:
            type: boolean
        - name: heuristicOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Combined filtered graph with per-layer counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphSubgraph"
        "400":
          description: Missing or invalid projectId
          content:
            application/json:
              schema:
