  /api/ai/chat/rebase-changes:
    post:
      operationId: aiRebaseChanges
      summary: Rebase a stale AI patch onto the current workspace without writing files
      description: >
        Attempts a deterministic Patch Lab rebase. Every expected hunk must
        match exactly once in the current file. A successful rebase updates the
        still-pending proposal and requires the user to review and approve the
        returned changes again. Conflicts leave both the workspace and proposal
        unchanged.
      tags: [AI]
      security:
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiRebaseChangesRequest"
      responses:
        "200":
          description: Patch rebased successfully; user approval is required again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRebaseChangesResult"
        "400":
          description: Invalid request body
        "404":
          description: Project or proposal not found
        "409":
          description: Proposal mismatch, concurrent apply, consumed proposal, or unsafe hunk conflict

