          description: Token is missing or empty
        "401":
          description: Not authenticated
    delete:
      operationId: deleteGitHubToken
      summary: Remove the authenticated user's saved GitHub PAT
      tags: [Git]
      responses:
        "200":
          description: Token removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubTokenStatus"
        "401":
          description: Not authenticated

  /api/projects/{projectId}/git/config:
    get:
      operationId: getGitConfig
      summary: Get git remote URL and default branch for a project
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Git configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConfig"
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found
    patch:
      operationId: updateGitConfig
      summary: Update git remote URL and/or default branch for a project
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGitConfigInput"
      responses:
        "200":
          description: Updated git configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitConfig"
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found

  /api/projects/{projectId}/git/status:
    get:
      operationId: getGitStatus
      summary: Get git working-tree status for a project
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitStatus"
        "400":
          description: Project directory is not a git repository
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found

  /api/projects/{projectId}/git/log:
    get:
      operationId: getGitLog
      summary: Get recent git commit history for a project (last 20 commits)
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Git commit log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLog"
        "400":
          description: Project directory is not a git repository
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found

  /api/projects/{projectId}/git/commit:
    post:
      operationId: gitCommit
      summary: Stage all changes and create a git commit
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCommitInput"
      responses:
        "200":
          description: Commit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitOperationResult"
        "400":
          description: Commit message is missing
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found
        "409":
          description: Nothing to commit — working tree is clean

  /api/projects/{projectId}/git/push:
    post:
      operationId: gitPush
      summary: Push the current branch to the configured remote using the stored GitHub token
      tags: [Git]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitPushInput"
      responses:
        "200":
          description: Push succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitPushResult"
        "400":
          description: No remote URL configured or remote URL is not HTTPS
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found
        "428":
          description: GitHub token not configured

  /api/projects/{projectId}/export:
    get:
      operationId: exportProject
      summary: Download a gzipped tar archive of the project root
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project archive streamed as application/gzip
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
        "403":
          description: Access denied
        "404":
          description: Project not found

components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: >
        Clerk session cookie. All /api/* routes (except /api/healthz) require a
        valid Clerk session. The cookie is set automatically by the Clerk frontend
        SDK after sign-in — no manual header injection is needed.

  schemas:
    ObjectiveContract:
      type: object
      additionalProperties: false
      description: Server-validated completion objective used to scope evidence and prevent incomplete claims from being reported as success.
      required: [objectiveType, requiredClaims, requiredEvidenceEdges]
      properties:
        objectiveType:
          type: string
          minLength: 1
          maxLength: 80
        requiredClaims:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [claimId, text]
            properties:
              claimId: { type: string, minLength: 1 }
              text: { type: string, minLength: 1 }
        requiredEvidenceEdges:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [from, to, relationship]
            properties:
              from: { type: string, minLength: 1 }
              to: { type: string, minLength: 1 }
              relationship: { type: string, minLength: 1 }
        scopePolicy:
          type: object
          additionalProperties: false
          required: [primaryPaths]
          properties:
            primaryPaths:
              type: array
              maxItems: 12
              items: { type: string, minLength: 1, maxLength: 500 }
            allowedExpansionPaths:
              type: array
              maxItems: 24
              items: { type: string, minLength: 1, maxLength: 500 }
            forbiddenPaths:
              type: array
              maxItems: 24
              items: { type: string, minLength: 1, maxLength: 500 }
    ValidationResult:
      type: object
      additionalProperties: false
      description: >
        Canonical registered-validation result shared by the validator,
        repair loop, API trace/SSE, and dashboard. Evidence metadata identifies
        the bounded validation artifact that can be inspected again.
      required:
        - profile
        - status
        - scenario
        - exitCode
        - command
        - stdout
        - stderr
        - failedTests
        - changedFiles
        - evidence
      properties:
        profile:
          type: string
        status:
          type: string
          enum: [passed, failed, skipped, unavailable, blocked]
        scenario:
          type: string
        exitCode:
          type: [integer, "null"]
        command:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        failedTests:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFailure"
        changedFiles:
          type: array
          items:
            type: string
        evidence:
          $ref: "#/components/schemas/ValidationEvidence"
        detail:
          type: string
    ValidationFailure:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name:
          type: string
        file:
          type: string
        line:
          type: integer
        message:
          type: string
    ValidationEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, observedAt, artifactRef]
      properties:
        evidenceId:
          type: string
        observedAt:
          type: string
          format: date-time
        artifactRef:
          type: string

    AiBenchmarkScorecard:
      type: object
      additionalProperties: false
      description: >
        Bounded live Code Agent benchmark metadata. Rollout is allowed only
        when the complete live run passes its explicit approved baseline gate.
        Provider-unavailable cases remain visible as U and block rollout without
        being counted as agent-quality failures.
      properties:
        suiteVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        provider:
          type: string
        model:
          type: [string, "null"]
        metrics:
          $ref: "#/components/schemas/AiBenchmarkMetrics"
        rolloutAllowed:
          type: boolean
        rolloutBlockers:
          type: array
          items:
            type: string
        baseline:
          $ref: "#/components/schemas/AiBenchmarkBaselineRef"
        baselineComparison:
          $ref: "#/components/schemas/AiBenchmarkBaselineComparison"

    AiAutonomousDeliveryAcceptance:
      type: object
      additionalProperties: false
      description: >
        Bounded, redacted acceptance outcomes for isolated campaign operations.
        This measurement is independent from deterministic release checks.
      required: [kind, version, campaign, operationCount, outcomeCounts, metrics, operations]
      properties:
        kind: { type: string, enum: [autonomous-delivery-acceptance] }
        version: { type: integer }
        campaign:
          type: object
          additionalProperties: false
          required: [provider, browser, deployment, remoteDelivery, isolated, redacted]
          properties:
            provider: { type: string, enum: [deterministic, live] }
            browser: { type: boolean }
            deployment: { type: boolean }
            remoteDelivery: { type: boolean }
            isolated: { type: boolean }
            redacted: { type: boolean }
        operationCount: { type: integer }
        outcomeCounts:
          type: object
          additionalProperties: false
          properties:
            completed: { type: integer }
            safely-blocked: { type: integer }
            failed: { type: integer }
            uncertain: { type: integer }
        metrics:
          type: object
          additionalProperties: false
          properties:
            completionRate: { type: number }
            safeBlockRate: { type: number }
            failureRate: { type: number }
            uncertaintyRate: { type: number }
            recoveryRate: { type: number }
            scopeEscapeRate: { type: number }
            repeatedSideEffectRate: { type: number }
            verifiedCompletionCount: { type: integer }
        operations:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [operationId, caseId, outcome, verifiedCompletion, recovered, scopeViolation, repeatedSideEffect]
            properties:
              operationId: { type: string }
              caseId: { type: string }
              outcome: { type: string, enum: [completed, safely-blocked, failed, uncertain] }
              verifiedCompletion: { type: boolean }
              recovered: { type: boolean }
              scopeViolation: { type: boolean }
              repeatedSideEffect: { type: boolean }

    AiBenchmarkMetrics:
      type: object
      additionalProperties: false
      properties:
        observedCases:
          type: integer
        totalCases:
          type: integer
        gradeCounts:
          type: object
          additionalProperties:
            type: integer
        providerUnavailableCount:
          type: integer
        falseSuccessRate:
          type: number
        scopeEscapeRate:
          type: number
        correctCompletionRate:
          type: number

    AiBenchmarkBaselineRef:
      type: object
      additionalProperties: false
      properties:
        baselineId:
          type: string
        suiteVersion:
          type: string
        generatedAt:
          type: string
          format: date-time

    AiBenchmarkBaselineComparison:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [missing, incompatible, regressed, passed]
        baselineId:
          type: string
        baselineGeneratedAt:
          type: string
          format: date-time
        metricDeltas:
          type: object
          additionalProperties:
            type: number
        blockers:
          type: array
          items:
            type: string

    AiBenchmarkBaselineSnapshot:
      type: object
      additionalProperties: false
      properties:
        baselineId:
          type: string
        suiteVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        metrics:
          $ref: "#/components/schemas/AiBenchmarkMetrics"

    AiMissionControlEvidence:
      type: object
      additionalProperties: false
      required: [verdict, validationEvents, readEvents]
      properties:
        verdict:
          type: string
        reason:
          type: ["string", "null"]
        validationEvents:
          type: integer
        readEvents:
          type: integer

    AiMissionControlRecorderEvent:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        status:
          type: string
        tool:
          type: string
        provider:
          type: string
        model:
          type: string
        detail:
          type: string

    AiMissionControlExecution:
      type: object
      additionalProperties: false
      required:
        [id, projectId, state, executionStatus, objective, attempts,
         validationFailures, evidence, checkpointVersion, eventCount,
         completedNodes, totalNodes, recentEvents, operationId, revision,
         evidenceProjection, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        state:
          type: string
        executionStatus:
          type: string
        objective:
          type: string
        provider:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        attempts:
          type: integer
        validationFailures:
          type: integer
        evidence:
          $ref: "#/components/schemas/AiMissionControlEvidence"
        checkpointVersion:
          type: integer
        eventCount:
          type: integer
        completedNodes:
          type: integer
        totalNodes:
          type: integer
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/AiMissionControlRecorderEvent"
        operationId:
          type: string
        revision:
          type: ["string", "null"]
        evidenceProjection:
          $ref: "#/components/schemas/OperationEvidenceProjection"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    AiMissionControl:
      type: object
      additionalProperties: false
      required: [updatedAt, executions]
      properties:
        updatedAt:
          type: string
          format: date-time
        benchmark:
          type: ["object", "null"]
          additionalProperties: false
          properties:
            scorecard:
              $ref: "#/components/schemas/AiBenchmarkScorecard"
            baseline:
              $ref: "#/components/schemas/AiBenchmarkBaselineSnapshot"
        executions:
          type: array
          items:
            $ref: "#/components/schemas/AiMissionControlExecution"

    OperationEvidenceProjection:
      type: object
      additionalProperties: false
      required: [version, redacted, operationId, projectId, revision, terminalState,
                completeness, verified, hashes, counts, receipts, gaps]
      properties:
        version: { type: integer, enum: [1] }
        redacted: { type: boolean, enum: [true] }
        operationId: { type: string }
        projectId: { type: string }
        revision: { type: ["string", "null"] }
        terminalState: { type: string }
        completeness:
          type: string
          enum: [complete, partial, retained-with-gaps, blocked, failed, cancelled, uncertain]
        verified: { type: boolean, enum: [false] }
        hashes:
          type: object
          additionalProperties: false
          required: [changeSet, committed]
          properties:
            changeSet: { type: ["string", "null"] }
            committed: { type: ["string", "null"] }
        counts:
          type: object
          additionalProperties: false
          required: [executions, checkpoints, events, audit, taskLogs, journal, receipts]
          properties:
            executions: { type: integer }
            checkpoints: { type: integer }
            events: { type: integer }
            audit: { type: integer }
            taskLogs: { type: integer }
            journal: { type: integer }
            receipts: { type: integer }
        receipts:
          type: array
          items: { type: object, additionalProperties: true }
        gaps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, source, detail]
            properties:
              kind: { type: string, enum: [missing, expired, inaccessible, mismatch, unrecorded] }
              source: { type: string, enum: [execution, checkpoint, event, audit, task-log, journal, proposal, revision] }
              detail: { type: string }

    AiPlanDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]

    ApiError:
      type: object
      description: >
        Standard error envelope returned by all non-2xx JSON responses.
        Clients should always check for this shape before attempting to
        read a success body.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error summary.

    ValidationError:
      type: object
      description: >
        PR-03: Returned with HTTP 400 when the request body fails Zod schema
        validation in the Express error handler (`app.ts`). Extends the base
        ApiError envelope with a structured `issues` array so clients can
        surface per-field errors without string-parsing the `error` message.
        The `issues` entries follow the ZodIssue shape.
      required: [error, issues]
      additionalProperties: false
      properties:
        error:
          type: string
          example: "Validation error"
        issues:
          type: array
          items:
            type: object
            required: [code, path, message]
            properties:
              code:
                type: string
                description: Zod error code (e.g. "invalid_type", "too_small").
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
                description: Path segments from the root of the validated object.
              message:
                type: string
                description: Human-readable description of the validation failure.

    ArchiveUploadInput:
      type: object
      required: [archive]
      properties:
        archive:
          type: string
          format: binary
          description: Archive file (.zip or .tar.gz), max 50 MB

    ArchiveUploadOutput:
      type: object
      required: [uploadId, originalName]
      properties:
        uploadId:
          type: string
          description: >
            Opaque ID referencing the extracted upload. Pass this as
            `sourceConfig.uploadId` when starting an ARCHIVE_UPLOAD discovery session.
        originalName:
          type: string
          description: Original filename as reported by the browser.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        jobQueue:
          $ref: "#/components/schemas/JobQueueStats"
        operationalCounters:
          $ref: "#/components/schemas/OperationalCounters"
        aiDiagnosticsRetention:
          $ref: "#/components/schemas/AiDiagnosticsRetentionHealth"
        taskExecutionRetention:
          $ref: "#/components/schemas/TaskExecutionRetentionHealth"

    TaskExecutionRetentionHealth:
      type: object
      required:
        - status
        - attemptedAt
        - completedAt
        - taskLogRowsScanned
        - taskLogRowsRemoved
        - receiptRowsScanned
        - receiptRowsRemoved
      description: >
        Content-free status of the bounded task-log and terminal execution
        receipt retention sweep. Active and resumable executions are retained.
      properties:
        status:
          type: string
          enum: [success, failed]
        attemptedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        taskLogRowsScanned:
          type: integer
        taskLogRowsRemoved:
          type: integer
        receiptRowsScanned:
          type: integer
        receiptRowsRemoved:
          type: integer

    AiDiagnosticsRetentionHealth:
      type: object
      required:
        - status
        - attemptedAt
        - completedAt
        - chatRowsScanned
        - chatRowsPruned
        - executionRowsScanned
        - executionRowsPruned
      description: >
        Content-free status of the most recent historical AI diagnostics
        retention sweep. A failed sweep is retried on the next startup.
      properties:
        status:
          type: string
          enum: [success, failed]
        attemptedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        chatRowsScanned:
          type: integer
        chatRowsPruned:
          type: integer
        executionRowsScanned:
          type: integer
        executionRowsPruned:
          type: integer

    JobQueueStats:
      type: object
      required: [running, queued, concurrency]
      description: >
        Current state of the in-process job queue (scan + discovery jobs).
        ⚠️ This queue is process-local — jobs in flight are lost on restart.
        The reconciliation layer marks orphaned DB rows as `failed` on startup,
        but the work must be re-submitted by the caller.
      properties:
        running:
          type: integer
          description: Number of jobs currently executing
        queued:
          type: integer
          description: Number of jobs waiting for a free concurrency slot
        concurrency:
          type: integer
          description: Maximum number of jobs that can run simultaneously

    OperationalCounters:
      type: object
      required: [auditWriteFailures, auditWritesPending, auditWritesRecovered, auditPersistenceUnavailable, mutationsWithoutAudit, rateLimiterFailOpenCount]
      description: >
        PR-2: In-process counters for degraded subsystems. Resets to zero on
        process restart. A non-zero value means a best-effort or fail-open
        fallback was triggered and should be investigated via logs.
      properties:
        auditWriteFailures:
          type: integer
          description: >
            Number of audit_logs insert failures since last startup.
            Non-zero means state changes went unrecorded in the traceability trail.
        auditWritesPending:
          type: integer
          description: Audit rows currently awaiting durable recovery.
        auditWritesRecovered:
          type: integer
          description: Audit rows recovered after an earlier write failure.
        auditPersistenceUnavailable:
          type: integer
          description: Audit destination or durable outbox persistence failures since startup.
        mutationsWithoutAudit:
          type: integer
          description: Committed mutations whose audit intent could not be durably retained.
        rateLimiterFailOpenCount:
          type: integer
          description: >
            Number of times the LLM rate limiter failed open due to a DB error.
            Non-zero means the per-project call budget was not enforced for those calls.

    # ─── AI ────────────────────────────────────────────────────────────────────
    GroqKeyStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        last4:
          type: ["string", "null"]
          description: Last 4 characters of the saved key — shown in UI for confirmation
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SaveGroqKeyInput:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 10
          description: The Groq API key to save. Must not be logged or returned.

    DeepSeekKeyStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        last4:
          type: ["string", "null"]
          description: Last 4 characters of the saved key — shown in UI for confirmation
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SaveDeepSeekKeyInput:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 10
          description: The DeepSeek API key to save. Must not be logged or returned.

    OpenRouterKeyStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        last4:
          type: ["string", "null"]
          description: Last 4 characters of the saved key — shown in UI for confirmation
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SaveOpenRouterKeyInput:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 10
          description: The OpenRouter API key to save. Must not be logged or returned.

    GeminiKeyStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        last4:
          type: ["string", "null"]
          description: Last 4 characters of the saved key — shown in UI for confirmation
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SaveGeminiKeyInput:
      type: object
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          minLength: 10
          description: The Gemini API key to save. Must not be logged or returned.

    ProviderKeyStatus:
      type: object
      required: [configured]
      description: Generic key status response for any AI provider.
      properties:
        configured:
          type: boolean
        last4:
          type: ["string", "null"]
          description: Last 4 characters of the saved key
        updatedAt:
          type: ["string", "null"]
          format: date-time

    ActiveProviderStatus:
      type: object
      required: [configured]
      properties:
        provider:
          type: ["string", "null"]
          enum: [groq, deepseek, openrouter, gemini, "null"]
          description: The AI provider that will be used, or null if none is configured
        configured:
          type: boolean
          description: True if at least one provider key is available (personal or server-wide)

    BehavioralModelScorecard:
      type: object
      required:
        - model
        - windowMs
        - sampleCount
        - loopCount
        - softLimitCount
        - malformedJsonCount
        - loopRate
        - softLimitRate
        - malformedJsonRate
        - demoted
        - lastEventAt
      properties:
        model:
          type: string
        windowMs:
          type: integer
          description: Rolling behavioral observation window in milliseconds
        sampleCount:
          type: integer
        loopCount:
          type: integer
        softLimitCount:
          type: integer
        malformedJsonCount:
          type: integer
        loopRate:
          type: number
          format: double
        softLimitRate:
          type: number
          format: double
        malformedJsonRate:
          type: number
          format: double
        demoted:
          type: boolean
          description: True when recent loop rate exceeds the task-execution demotion threshold
        lastEventAt:
          type: string
          format: date-time

    # ─── Git ───────────────────────────────────────────────────────────────────
    GitHubTokenStatus:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
        last4:
          type: string
          nullable: true
          description: Last 4 characters of the saved token — shown in UI for confirmation
        updatedAt:
          type: string
          nullable: true
          format: date-time

    SaveGitHubTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: GitHub Personal Access Token. Must not be logged or returned.

    GitConfig:
      type: object
      required: [branch]
      properties:
        remoteUrl:
          type: string
          nullable: true
          description: HTTPS remote URL (e.g. https://github.com/owner/repo.git), or null if not set
        branch:
          type: string
          description: Default branch name (e.g. main)

    UpdateGitConfigInput:
      type: object
      properties:
        remoteUrl:
          type: string
          description: HTTPS remote URL. Pass an empty string to clear it.
        branch:
          type: string
          description: Default branch name. Defaults to "main" if cleared.

    GitStatusFile:
      type: object
      required: [status, path]
      properties:
        status:
          type: string
          description: Two-character git porcelain status code (e.g. "M ", " M", "??")
        path:
          type: string
          description: File path relative to the project root

    GitStatus:
      type: object
      required: [clean, files]
      properties:
        clean:
          type: boolean
          description: True when there are no uncommitted changes
        files:
          type: array
          items:
            $ref: "#/components/schemas/GitStatusFile"

    GitCommitEntry:
      type: object
      required: [hash, shortHash, date, author, subject]
      properties:
        hash:
          type: string
          description: Full 40-character commit SHA
        shortHash:
          type: string
          description: Abbreviated commit SHA
        date:
          type: string
          description: Commit date in YYYY-MM-DD format
        author:
          type: string
          description: Author name
        subject:
          type: string
          description: First line of the commit message

    GitLog:
      type: object
      required: [commits]
      properties:
        commits:
          type: array
          items:
            $ref: "#/components/schemas/GitCommitEntry"

    GitCommitInput:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          description: Commit message.
        proposalId:
          type: string
          description: Optional server-owned AI proposal. When provided, only its verified applied paths are staged.
        operationId:
          type: string
          description: Optional plan message ID used as the root of the end-to-end operation trace.

    GitOperationResult:
      type: object
      required: [ok, output, correlationId]
      properties:
        ok:
          type: boolean
        output:
          type: string
          description: Combined stdout/stderr from git, with any embedded credentials redacted
        correlationId:
          type: string
          description: Logical operation identifier used to retrieve the end-to-end event trace
        commitHash:
          type: string
          description: Commit SHA created by a successful commit or pushed by a successful push
        committedPaths:
          type: array
          items:
            type: string
          description: Files included in a successful commit

    GitPushInput:
      type: object
      additionalProperties: false
      properties:
        proposalId:
          type: string
          description: Optional applied AI proposal whose operation trace should include this push
        operationId:
          type: string
          description: Optional plan message ID used as the root of the end-to-end operation trace

    GitPushResult:
      type: object
      required: [ok, branch, output, correlationId, commitHash]
      properties:
        ok:
          type: boolean
        branch:
          type: string
          description: Branch that was pushed
        output:
          type: string
          description: Combined stdout/stderr from git push, with any embedded credentials redacted
        correlationId:
          type: string
          description: Logical operation identifier used to retrieve the end-to-end event trace
        commitHash:
          type: string
          description: Commit SHA proven to exist locally immediately before the push
        remoteCommitHash:
          type: string
          description: Commit SHA created or confirmed on the GitHub remote

    AiChatRequest:
      type: object
      required: [projectId, message]
      additionalProperties: false
      properties:
        projectId:
          type: string
        message:
          type: string
        sessionId:
          type: string
        linkedTaskId:
          type: string
          description: Optional task to associate with the chat session
        buildPlanMessageId:
          type: string
          description: Build handoff for a previously approved implementation-plan message; the server enforces its declared file scope
        executionId:
          type: string
          description: Durable execution to resume; must belong to the same user, project, and session
        resumeToken:
          type: string
          minLength: 32
          maxLength: 128
          description: Opaque server-issued token required when resuming an execution
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          description: Stable retry key used to avoid creating duplicate executions
        objective:
          $ref: "#/components/schemas/ObjectiveContract"

    AiChatSession:
      type: object
      required: [id, projectId, title, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        linkedTaskId:
          type: string
          nullable: true
          description: Task associated with this chat session, when present
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        forensicStatus:
          type: string
          nullable: true
          description: Derived forensic outcome for the latest assistant audit result, when available
          enum: [INCOMPLETE, NO_FINDING, FINDING_PROVEN, NOT_PROVEN]

    MissionCorrelationReport:
      type: object
      additionalProperties: false
      required:
        - kind
        - version
        - redacted
        - operationId
        - projectId
        - sessionId
        - workspaceRevision
        - terminalState
        - outcomeClass
        - counts
        - agreement
      properties:
        kind:
          type: string
          enum: [mission-correlation-report]
        version:
          type: integer
          enum: [1]
          description: Stored report contract version.
        redacted:
          type: boolean
          enum: [true]
        operationId:
          type: string
        projectId:
          type: string
        sessionId:
          type: string
        workspaceRevision:
          type: string
        generatedAt:
          type: string
          format: date-time
          description: When an unavailable historical report was regenerated from retained evidence
        terminalState:
          type: string
          enum: [COMPLETED, READY_FOR_REVIEW, APPLIED, COMMITTED, PUSHED, BLOCKED, CANCELLED, FAILED, UNAVAILABLE]
        outcomeClass:
          type: string
        counts:
          type: object
          additionalProperties: false
          required: [messages, sseEvents, executionCheckpoints, evidence, proposals, validation, correlatedEvents]
          properties:
            messages: { type: integer, minimum: 0 }
            sseEvents: { type: integer, minimum: 0 }
            executionCheckpoints: { type: integer, minimum: 0 }
            evidence: { type: integer, minimum: 0 }
            proposals: { type: integer, minimum: 0 }
            validation: { type: integer, minimum: 0 }
            correlatedEvents: { type: integer, minimum: 0 }
        agreement:
          type: object
          additionalProperties: false
          required: [execution, messages, sse, checkpoints, dashboard, evidence, proposals, validation]
          properties:
            execution: { type: boolean }
            messages: { type: boolean }
            sse: { type: boolean }
            checkpoints: { type: boolean }
            dashboard: { type: boolean }
            evidence: { type: boolean }
            proposals: { type: boolean }
            validation: { type: boolean }

    AiChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        sources:
          type: string
          nullable: true
        toolTrace:
          type: string
          nullable: true
        turnIntent:
          type: string
          nullable: true
          description: Server-authoritative intent used to route this turn
        executionId:
          type: string
          nullable: true
          description: Durable execution linked to this conversational turn
        outcome:
          type: string
          nullable: true
          enum: [SUCCEEDED, FAILED, INTERRUPTED]
        errorCode:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        behaviorEvidence:
          description: Parsed accepted behavior-evidence references, each with an optional exact source line span
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/BehaviorEvidence"
        missionCorrelationReport:
          description: Versioned, redacted correlation report retained with a historical mission message
          nullable: true
          $ref: "#/components/schemas/MissionCorrelationReport"
        taskResult:
          description: AI-008 — persisted per-task typed result discriminated on `kind` by forensicTaskType. Absent for generic chat turns.
          oneOf:
            - $ref: "#/components/schemas/AiCodeExtractionResult"
            - $ref: "#/components/schemas/AiBehaviorAnswerResult"
            - $ref: "#/components/schemas/AiFindingResult"
            - $ref: "#/components/schemas/AiForensicReportResult"
            - $ref: "#/components/schemas/AiWorkspaceReviewResult"
            - $ref: "#/components/schemas/AiRepairResult"
          discriminator:
            propertyName: kind
            mapping:
              CODE_EXTRACTION_RESULT: "#/components/schemas/AiCodeExtractionResult"
              BEHAVIOR_ANSWER_RESULT: "#/components/schemas/AiBehaviorAnswerResult"
              FINDING_RESULT: "#/components/schemas/AiFindingResult"
              FORENSIC_REPORT_RESULT: "#/components/schemas/AiForensicReportResult"
              WORKSPACE_REVIEW_RESULT: "#/components/schemas/AiWorkspaceReviewResult"
              REPAIR_RESULT: "#/components/schemas/AiRepairResult"
              IMPLEMENTATION_PLAN_RESULT: "#/components/schemas/AiImplementationPlanResult"
        createdAt:
          type: string
          format: date-time

    AiImplementationPlanResult:
      type: object
      required: [kind, objective, summary, assumptions, steps, validationCommands, risks, approvalStatus, writeAccess]
      properties:
        kind:
          type: string
          enum: [IMPLEMENTATION_PLAN_RESULT]
        objective: { type: string }
        summary: { type: string }
        assumptions:
          type: array
          items: { type: string }
        steps:
          type: array
          items: { type: object, additionalProperties: true }
        validationCommands:
          type: array
          items: { type: string }
        risks:
          type: array
          items: { type: string }
        approvalStatus:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED]
        writeAccess:
          type: string
          enum: [NOT_AUTHORIZED, APPROVED_FOR_BUILD]

    BehaviorEvidence:
      type: object
      required: [source, supportsClaim]
      properties:
        source:
          type: string
        excerpt:
          type: string
        supportsClaim:
          type: boolean
        directness:
          type: string
          enum: [DIRECT, INDIRECT]
        sourceType:
          type: string
        evidenceClass:
          type: string
        sourceSpan:
          $ref: "#/components/schemas/SourceSpan"

    SourceSpan:
      type: object
      required: [startLine, endLine]
      properties:
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1

    AiFileContentLine:
      type: object
      required: [line, text]
      properties:
        line:
          type: integer
        text:
          type: string

    AiFileContent:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: Reason code when available=false (project_root_unavailable, file_not_found, file_unreadable, outside_project_root)
        path:
          type: string
        startLine:
          type: integer
        endLine:
          type: integer
        fileLines:
          type: integer
        truncated:
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/AiFileContentLine"

    AiReviewRequest:
      type: object
      properties:
        fileContents:
          type: object
          additionalProperties:
            type: string

    AiOrchestrateRequest:
      type: object
      properties:
        additionalContext:
          type: string

    AiPendingChange:
      type: object
      required: [path, absolutePath, newContent, reason]
      properties:
        path:
          type: string
          description: Normalized relative path within the project root
        absolutePath:
          type: string
          description: Absolute filesystem path; must be inside the project root
        newContent:
          type: string
          description: Full new content to write to the file
        originalContent:
          type: string
          nullable: true
          description: Original content before the change, or null for new files
        baseHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: SHA-256 hash of the source content observed when the patch was generated
        hunks:
          type: array
          maxItems: 100
          description: Line-scoped expected and replacement text used for Patch Lab conflict detection
          items:
            $ref: "#/components/schemas/AiFilePatchHunk"
        reason:
          type: string
          description: One-sentence explanation of why this change is proposed
        validationProfile:
          type: string
          enum: [ai-orchestrator-tests, knowledge-engine-tests, api-ai-tests, workspace-typecheck]
          description: Registered behavioral validation profile when the change is eligible for approval
        risk:
          type: string
          enum: [low, medium, high]
          description: Server-derived change risk shown in Patch Lab
        evidence:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AiPatchEvidenceLink"

    AiApplyChangesRequest:
      type: object
      additionalProperties: false
      required: [projectId, proposalId, changes]
      properties:
        projectId:
          type: string
        proposalId:
          type: string
          description: Server-owned approval proposal that must match the submitted changes exactly
        operationId:
          type: string
          description: Plan message ID used as the root of the end-to-end operation trace
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, absolutePath, newContent, originalContent, reason, validationProfile]
            properties:
              path:
                type: string
              absolutePath:
                type: string
              newContent:
                type: string
              originalContent:
                type: string
                nullable: true
                description: Original content observed when the AI proposed the change; used to reject stale approvals
              baseHash:
                type: string
                pattern: "^[a-f0-9]{64}$"
                description: SHA-256 hash of the source content observed when the patch was generated
              hunks:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/AiFilePatchHunk"
              reason:
                type: string
                description: One-sentence explanation of why this change is proposed
              validationProfile:
                type: string
                enum: [ai-orchestrator-tests, knowledge-engine-tests, api-ai-tests, workspace-typecheck]
                description: Registered behavioral validation profile; arbitrary commands are not accepted
              risk:
                type: string
                enum: [low, medium, high]
              evidence:
                type: array
                maxItems: 4
                items:
                  $ref: "#/components/schemas/AiPatchEvidenceLink"

    AiRebaseChangesRequest:
      type: object
      additionalProperties: false
      required: [projectId, proposalId, changes]
      properties:
        projectId:
          type: string
        proposalId:
          type: string
          description: Server-owned pending proposal to rebase
        changes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AiPendingChange"

    AiRebaseChangesResult:
      type: object
      required: [proposalId, changes, rebasedFiles, approvalRequired, revision]
      properties:
        proposalId:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AiPendingChange"
        rebasedFiles:
          type: array
          items:
            type: string
        approvalRequired:
          type: boolean
          description: Always true because the rebased diff must be reviewed again
        revision:
          type: integer
          minimum: 0
          description: Server-owned proposal revision that must be approved before apply

    AiApproveRebasedProposalRequest:
      type: object
      additionalProperties: false
      required: [projectId, revision]
      properties:
        projectId:
          type: string
        revision:
          type: integer
          minimum: 0

    AiApproveRebasedProposalResult:
      type: object
      required: [proposalId, approvalRequired, revision]
      properties:
        proposalId:
          type: string
        approvalRequired:
          type: boolean
          description: False after the requested rebased revision is approved
        revision:
          type: integer
          minimum: 0

    AiPendingProposal:
      type: object
      required: [proposalId, operationId, changes, approvalRequired, revision]
      properties:
        proposalId:
          type: string
          nullable: true
        operationId:
          type: string
          nullable: true
          description: Plan message ID used as the root of the end-to-end operation trace
        changes:
          type: array
          items:
            $ref: "#/components/schemas/AiPendingChange"
        approvalRequired:
          type: boolean
          description: True when a rebased proposal must be reviewed and approved again
        revision:
          type: integer
          nullable: true
          minimum: 0
          description: Current server-owned proposal revision, or null when no pending proposal exists

    AiFilePatchHunk:
      type: object
      additionalProperties: false
      required: [startLine, endLine, expectedText, replacementText, reason]
      properties:
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        expectedText:
          type: string
        replacementText:
          type: string
        reason:
          type: string
          minLength: 1
        risk:
          type: string
          enum: [low, medium, high]
        evidence:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AiPatchEvidenceLink"

    AiPatchEvidenceLink:
      type: object
      additionalProperties: false
      required: [kind, id, label]
      properties:
        kind:
          type: string
          enum: [finding, source, validation]
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
          maxLength: 240
        file:
          type: string
          minLength: 1
        line:
          type: integer
          minimum: 1

    AiApplyChangesResult:
      type: object
      required: [results, correlationId]
      properties:
        correlationId:
          type: string
          description: Logical operation identifier shared with the proposal's plan and later Git operations
        results:
          type: array
          items:
            type: object
            required: [path, ok]
            properties:
              path:
                type: string
              ok:
                type: boolean
              code:
                type: string
              error:
                type: string
              conflict:
                type: object
                additionalProperties: false
                properties:
                  kind:
                    type: string
                    enum: [base_hash_mismatch, hunk_mismatch]
                  expectedHash:
                    type: string
                  actualHash:
                    type: string
                  hunkIndex:
                    type: integer
              writeStatus:
                type: string
                enum: [written, not_written]
                description: "`not_written` also covers a guarded rollback when mandatory behavioral verification does not pass."
              persistenceVerified:
                type: boolean
                description: True only when the new bytes remain persisted after the behavioral gate passes.
              behavioralVerification:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [passed, failed, skipped, unavailable]
                  profile:
                    type: string
                  scenario:
                    type: string
                  detail:
                    type: string
                description: Registered behavioral verification runs after the guarded write. Any status other than `passed` rolls the change back and leaves its approval proposal pending.

    AiChatOutput:
      type: object
      required: [sessionId, message, sources, pendingChanges]
      properties:
        sessionId:
          type: string
        message:
          $ref: "#/components/schemas/AiChatMessage"
        sources:
          type: array
          items:
            type: string
        pendingChanges:
          type: array
          description: File changes proposed by the AI agent; populated only when a server-owned approval proposal was created
          items:
            $ref: "#/components/schemas/AiPendingChange"
        proposalId:
          type: string
          description: Server-owned approval proposal ID, when the pending changes are eligible for approval
        proposalUnavailable:
          type: string
          description: Bounded explanation when proposed changes could not receive an approval proposal
        repairPlan:
          type: array
          description: Server-verified structured Repair Plan metadata
          items:
            type: object
            additionalProperties: true
        productionReachability:
          $ref: "#/components/schemas/ProductionReachabilityTrace"
        crossFileTraces:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/CrossFileSemanticTrace"
        taskResult:
          description: AI-008 — per-task typed result discriminated on `kind` by forensicTaskType. Absent for generic chat turns.
          oneOf:
            - $ref: "#/components/schemas/AiCodeExtractionResult"
            - $ref: "#/components/schemas/AiBehaviorAnswerResult"
            - $ref: "#/components/schemas/AiFindingResult"
            - $ref: "#/components/schemas/AiForensicReportResult"
            - $ref: "#/components/schemas/AiWorkspaceReviewResult"
            - $ref: "#/components/schemas/AiRepairResult"
          discriminator:
            propertyName: kind
            mapping:
              CODE_EXTRACTION_RESULT: "#/components/schemas/AiCodeExtractionResult"
              BEHAVIOR_ANSWER_RESULT: "#/components/schemas/AiBehaviorAnswerResult"
              FINDING_RESULT: "#/components/schemas/AiFindingResult"
              FORENSIC_REPORT_RESULT: "#/components/schemas/AiForensicReportResult"
              WORKSPACE_REVIEW_RESULT: "#/components/schemas/AiWorkspaceReviewResult"
              REPAIR_RESULT: "#/components/schemas/AiRepairResult"

    AiCodeExtractionResult:
      type: object
      required: [kind, extractedCode]
      properties:
        kind:
          type: string
          enum: [CODE_EXTRACTION_RESULT]
        extractedCode:
          type: string
        source:
          type: string

    AiBehaviorAnswerResult:
      type: object
      required: [kind, answer]
      properties:
        kind:
          type: string
          enum: [BEHAVIOR_ANSWER_RESULT]
        answer:
          type: object
          description: Semantic behavior answer with evidence and coverage metadata
          additionalProperties: true

    AiFindingResult:
      type: object
      required: [kind, finding]
      properties:
        kind:
          type: string
          enum: [FINDING_RESULT]
        finding:
          type: object
          description: Finding analysis with severity and evidence
          additionalProperties: true

    AiForensicReportResult:
      type: object
      required: [kind, report, evidence]
      properties:
        kind:
          type: string
          enum: [FORENSIC_REPORT_RESULT]
        report:
          type: string
          minLength: 1
        evidence:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true

    AiWorkspaceReviewResult:
      type: object
      required: [kind, report, evidence]
      properties:
        kind:
          type: string
          enum: [WORKSPACE_REVIEW_RESULT]
        report:
          type: string
          minLength: 1
        evidence:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: true

    AiRepairResult:
      type: object
      required: [kind, phases, readiness]
      properties:
        kind:
          type: string
          enum: [REPAIR_RESULT]
        phases:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: true
        readiness:
          type: string
          enum: [READY, BLOCKED, NOT_PROVEN]

    SemanticTraceSourceSpan:
      type: object
      required: [file, line]
      properties:
        file:
          type: string
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 0
        snippet:
          type: string

    SemanticTraceNode:
      type: object
      required: [id, name, stage]
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        stage:
          type: string
          enum: [ENTRY_POINT, API_ROUTE, ORCHESTRATOR, TOOL_PROVIDER, PERSISTENCE_OUTPUT, OTHER]

    SemanticTraceEdge:
      type: object
      required: [from, to, relation, status, runtimeObserved]
      properties:
        from:
          type: string
        to:
          type: string
        relation:
          type: string
        status:
          type: string
          enum: [PROVEN, NOT_PROVEN, OUT_OF_SCOPE]
        source:
          type: string
        evidence:
          type: string
        sourceSpan:
          $ref: "#/components/schemas/SemanticTraceSourceSpan"
        runtimeObserved:
          type: boolean

    CrossFileSemanticTrace:
      type: object
      required: [status, nodes, edges, maxDepth]
      properties:
        status:
          type: string
          enum: [PROVEN, NOT_PROVEN, OUT_OF_SCOPE]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SemanticTraceNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SemanticTraceEdge"
        maxDepth:
          type: integer
          minimum: 1
          maximum: 8
        reason:
          type: string

    ProductionReachabilityTrace:
      type: object
      required: [status, nodes, edges]
      properties:
        status:
          type: string
          enum: [PROVEN, NOT_PROVEN, OUT_OF_SCOPE]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/SemanticTraceNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/SemanticTraceEdge"
        reason:
          type: string

    AiScanInsight:
      type: object
      required: [category, severity, title, description, recommendation]
      properties:
        category:
          type: string
          enum: [architecture, security, performance, reliability, maintainability]
        severity:
          type: string
          enum: [critical, high, medium, low]
        title:
          type: string
        description:
          type: string
        recommendation:
          type: string

    AiScanAnalysis:
      type: object
      required: [summary, overallAssessment, insights, topPriority, estimatedImpact, operationId, projectId, projectRevision, rootAvailable, incomplete, operationalTrace]
      properties:
        summary:
          type: string
        overallAssessment:
          type: string
        insights:
          type: array
          items:
            $ref: "#/components/schemas/AiScanInsight"
        topPriority:
          type: string
        estimatedImpact:
          type: string
        operationId:
          type: string
        projectId:
          type: string
        projectRevision:
          type: string
        rootAvailable:
          type: boolean
        incomplete:
          type: boolean
        operationalTrace:
          type: array
          items:
            $ref: "#/components/schemas/AiStructuredAuditTraceEntry"

    AiCodeIssue:
      type: object
      required: [type, severity, title, description, suggestion]
      properties:
        type:
          type: string
          enum: [bug, security, performance, style, architecture]
        severity:
          type: string
          enum: [critical, high, medium, low]
        file:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        suggestion:
          type: string

    AiCodeReview:
      type: object
      required: [summary, overallScore, strengths, issues, refactoringOpportunities, securityConcerns, verdict, operationId, projectId, projectRevision, rootAvailable, incomplete, operationalTrace]
      properties:
        summary:
          type: string
        overallScore:
          type: number
        strengths:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/AiCodeIssue"
        refactoringOpportunities:
          type: array
          items:
            type: string
        securityConcerns:
          type: array
          items:
            type: string
        verdict:
          type: string
          enum: [approved, needs_changes, major_rework]
        operationId:
          type: string
        projectId:
          type: string
        projectRevision:
          type: string
        rootAvailable:
          type: boolean
        incomplete:
          type: boolean
        operationalTrace:
          type: array
          items:
            $ref: "#/components/schemas/AiStructuredAuditTraceEntry"

    AiStructuredAuditTraceEntry:
      type: object
      required: [stage, status]
      properties:
        stage:
          type: string
        status:
          type: string
          enum: [started, completed, failed, incomplete]
        provider:
          type: string

    AiOrchestrationDecision:
      type: object
      required: [action, reasoning]
      properties:
        action:
          type: string
          enum: [advance, wait, fail, complete]
        reasoning:
          type: string
        nextPhase:
          type: string
          nullable: true
        blockers:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string

    # ─── Enums ─────────────────────────────────────────────────────────────────
    TaskStatus:
      type: string
      enum: [pending, queued, running, verifying, completed, failed, cancelled]

    TaskPriority:
      type: string
      enum: [p0, p1, p2, p3]

    RuleSeverity:
      type: string
      enum: [critical, high, medium, low, info]

    WorkflowStatus:
      type: string
      enum: [idle, running, completed, failed, stopped]

    EntityType:
      type: string
      enum: [file, function, class, api, task, rule, phase, module]

    # ─── Project ───────────────────────────────────────────────────────────────
    Project:
      type: object
      required: [id, ownerId, name, rootPath, language, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        ownerId:
          type: string
          description: Clerk user id of the project owner. Access to this project is scoped to this user.
        name:
          type: string
        description:
          type: string
        rootPath:
          type: string
        language:
          type: string
        framework:
          type: string
        status:
          type: string
          enum: [active, scanning, paused, archived]
        qualityScore:
          type: number
        lastScanAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProjectInput:
      type: object
      required: [name, rootPath, language]
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        rootPath:
          type: string
        language:
          type: string
        framework:
          type: string

    UpdateProjectInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, scanning, paused, archived]

    ScanResult:
      type: object
      required: [projectId, scannedAt, filesFound, issuesDetected, tasksCreated]
      properties:
        projectId:
          type: string
        scannedAt:
          type: string
          format: date-time
        filesFound:
          type: integer
        issuesDetected:
          type: integer
        tasksCreated:
          type: integer
        summary:
          type: string

    ScanJob:
      type: object
      description: >
        Background scan job. Scanning a project (file walk + rule matching +
        graph extraction + metrics) is heavy, so POST .../scan only enqueues
        it and returns this record immediately with status "queued"; poll
        GET .../scan-jobs/{jobId} until status is "completed" or "failed".
      required: [id, projectId, status, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        result:
          $ref: "#/components/schemas/ScanResult"
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time

    ProjectSummary:
      type: object
      required: [projectId, qualityScore, taskCounts, recentEvents, latestMetrics]
      properties:
        projectId:
          type: string
        qualityScore:
          type: number
        taskCounts:
          type: object
          required: [total, pending, running, completed, failed]
          properties:
            total:
              type: integer
            pending:
              type: integer
            running:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        latestMetrics:
          $ref: "#/components/schemas/MetricRecord"

    # ─── Task ──────────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, projectId, title, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        ruleId:
          type: string
        workflowId:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        relatedFiles:
          type: array
          items:
            type: string
        dependsOn:
          type: array
          items:
            type: string
        retryCount:
          type: integer
        maxRetries:
          type: integer
        phase:
          type: string
        prompt:
          type: string
        agentResponse:
          type: string
        verificationResult:
          $ref: "#/components/schemas/VerificationResult"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    CreateTaskInput:
      type: object
      required: [projectId, title, priority]
      additionalProperties: false
      properties:
        projectId:
          type: string
        ruleId:
          type: string
        workflowId:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          $ref: "#/components/schemas/TaskPriority"
        relatedFiles:
          type: array
          items:
            type: string
        dependsOn:
          type: array
          items:
            type: string
        phase:
          type: string

    UpdateTaskInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"

    TaskLog:
      type: object
      required: [id, taskId, level, message, timestamp]
      properties:
        id:
          type: string
        taskId:
          type: string
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        metadata:
          type: object
        timestamp:
          type: string
          format: date-time

    VerificationResult:
      type: object
      required: [passed, steps]
      properties:
        passed:
          type: boolean
        steps:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name:
                type: string
              passed:
                type: boolean
              output:
                type: string

    # ─── Rule ──────────────────────────────────────────────────────────────────
    Rule:
      type: object
      required: [id, code, title, severity, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        code:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        pattern:
          type: string
        fixDescription:
          type: string
        verifySteps:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        hitCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRuleInput:
      type: object
      required: [code, title, severity]
      additionalProperties: false
      properties:
        projectId:
          type: string
        code:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        pattern:
          type: string
        fixDescription:
          type: string
        verifySteps:
          type: array
          items:
            type: string

    UpdateRuleInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        pattern:
          type: string
        fixDescription:
          type: string
        enabled:
          type: boolean

    RuleEvaluationResult:
      type: object
      required: [ruleId, projectId, matched, matchCount, matches]
      properties:
        ruleId:
          type: string
        projectId:
          type: string
        matched:
          type: boolean
        matchCount:
          type: integer
        matches:
          type: array
          items:
            type: object
            required: [file, line, snippet]
            properties:
              file:
                type: string
              line:
                type: integer
              snippet:
                type: string

    # ─── Workflow ──────────────────────────────────────────────────────────────
    Workflow:
      type: object
      required: [id, projectId, name, status, phases, createdAt, updatedAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        phases:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowPhase"
        currentPhase:
          type: string
        executionCount:
          type: integer
        lastExecutedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowPhase:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
        steps:
          type: array
          items:
            type: string
        condition:
          type: string

    CreateWorkflowInput:
      type: object
      required: [projectId, name, phases]
      additionalProperties: false
      properties:
        projectId:
          type: string
        name:
          type: string
        description:
          type: string
        phases:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowPhase"

    FailWorkflowPhaseInput:
      type: object
      properties:
        error:
          type: string

    RollbackWorkflowPhaseInput:
      type: object
      required: [targetPhase]
      additionalProperties: false
      properties:
        targetPhase:
          type: string
          description: Name of a phase already completed by this execution

    WorkflowExecution:
      type: object
      required: [id, workflowId, status, startedAt]
      properties:
        id:
          type: string
        workflowId:
          type: string
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        currentPhase:
          type: string
        completedPhases:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorMessage:
          type: string

    # ─── Event ─────────────────────────────────────────────────────────────────
    Event:
      type: object
      required: [id, type, projectId, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        projectId:
          type: string
        taskId:
          type: string
        workflowId:
          type: string
        payload:
          type: object
        severity:
          type: string
          enum: [info, warning, error, success]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          description: >
            Ties this event to a logical operation (scan, task execute, workflow
            advance). All records sharing the same correlationId were produced
            by a single call — filter by this to see the full trace.

    # ─── Metrics ───────────────────────────────────────────────────────────────
    MetricRecord:
      type: object
      required: [id, projectId, timestamp, overallScore]
      properties:
        id:
          type: string
        projectId:
          type: string
        timestamp:
          type: string
          format: date-time
        overallScore:
          type: number
        architectureScore:
          type: number
        securityScore:
          type: number
        performanceScore:
          type: number
        reliabilityScore:
          type: number
        maintainabilityScore:
          type: number
        testCoverage:
          type: number
        lintIssues:
          type: integer
        testsPassed:
          type: integer
        testsTotal:
          type: integer
        technicalDebt:
          type: number
        buildStatus:
          type: string
          enum: [passing, failing, unknown]

    # ─── Knowledge Graph ───────────────────────────────────────────────────────
    GraphProvenance:
      type: object
      # KG-02: all fields are optional for backwards compatibility — rows from
      # before KG 2.0 may omit some fields. The old `extractor` field has been
      # renamed to `sourceType` to match the DB schema and runtime shape.
      description: >
        Provenance record for a graph entity or relationship. All fields are
        optional for backwards compatibility.
      properties:
        sourceType:
          type: string
          description: >
            Broad extraction category: typescript-ast | python-ast |
            regex-fallback | manual | discovery-import |
            provenance-registry-import. Replaces the old `extractor` field.
        method:
          type: string
          description: Specific mechanism (e.g. ts-compiler-api, api-route-detection)
        extractedAt:
          type: string
          format: date-time
        evidence:
          type: array
          description: Source location records that justify this element
          items:
            $ref: "#/components/schemas/GraphEvidence"

    GraphEdgeType:
      type: string
      description: Typed relationship category for Knowledge Graph 2.0
      enum:
        - imports
        - calls
        - extends
        - implements
        - uses
        - emits
        - observes
        - produces
        - depends_on

    GraphEvidence:
      type: object
      description: A single piece of evidence that justifies a graph entity or relationship
      required: [file, kind]
      properties:
        file:
          type: string
        line:
          type: integer
        column:
          type: integer
        snippet:
          type: string
          description: Source code snippet at the evidence location
        kind:
          type: string
          enum: [import-statement, call-site, class-definition, interface-definition, jsdoc, heuristic]

    GraphEntity:
      type: object
      required: [id, projectId, type, name, createdAt]
      properties:
        id:
          type: string
        projectId:
          type: string
        scanJobId:
          type: string
          description: The scan job that produced this entity, if any
        type:
          $ref: "#/components/schemas/EntityType"
        name:
          type: string
        path:
          type: string
        metadata:
          type: object
        # ── Knowledge Graph 2.0 semantic fields ────────────────────────────
        kind:
          type: string
          description: Sub-kind within the entity type (e.g. arrow-function, class-method, decorator)
        sourceType:
          type: string
          description: "Extraction source — typescript-ast | python-ast | regex-fallback | manual"
        isDocumented:
          type: boolean
          description: True when the entity has JSDoc, a docstring, or equivalent documentation
        semanticTags:
          type: array
          items:
            type: string
          description: Free-form semantic classification tags (e.g. auth, public-api, deprecated)
        description:
          type: string
          description: Short description from doc comment or declaration signature
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Extraction confidence — 1.0 = AST certainty, 0.5 = heuristic, 0.0 = unknown"
        domain:
          type: string
          description: Business domain (e.g. auth, payments, infra)
        lifecycle:
          type: string
          description: "Lifecycle stage — stable | experimental | deprecated | internal"
        provenance:
          $ref: "#/components/schemas/GraphProvenance"
        createdAt:
          type: string
          format: date-time

    GraphRelationship:
      type: object
      required: [id, sourceId, targetId, relation, createdAt]
      properties:
        id:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
        projectId:
          type: string
          description: Project this relationship belongs to (denormalised for efficient filtering)
        relation:
          type: string
          description: Raw relation string preserved from the extractor
        scanJobId:
          type: string
          description: The scan job that produced this relationship, if any
        # ── Knowledge Graph 2.0 semantic fields ────────────────────────────
        relationType:
          $ref: "#/components/schemas/GraphEdgeType"
        relationSubtype:
          type: string
          description: Fine-grained sub-classification (e.g. static-import, type-only-import)
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Edge weight for weighted graph algorithms (typically equals confidence)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Extraction confidence [0,1] — lower values indicate heuristic inference"
        isHeuristic:
          type: boolean
          description: True when inferred by heuristic rules rather than direct parse evidence
        isRuntimeObserved:
          type: boolean
          description: True when observed at runtime, not inferred by static analysis
        evidenceJson:
          type: array
          items:
            $ref: "#/components/schemas/GraphEvidence"
          description: Structured evidence records that justify this relationship
        evidenceCount:
          type: integer
          description: Number of evidence items (indexed separately for fast cardinality queries)
        evidenceSummary:
          type: string
          description: Human-readable summary of the evidence
        semanticTags:
          type: array
          items:
            type: string
        sourceType:
          type: string
          description: Which extractor produced this relationship
        metadata:
          type: object
        provenance:
          $ref: "#/components/schemas/GraphProvenance"
        createdAt:
          type: string
          format: date-time
    GraphListMeta:
      type: object
      required: [page, pageSize, total, truncated]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        truncated:
          type: boolean
    GraphEntityList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        meta:
          $ref: "#/components/schemas/GraphListMeta"
    GraphRelationshipList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GraphRelationship"
        meta:
          $ref: "#/components/schemas/GraphListMeta"

    GraphImpactHop:
      type: object
      required: [entity, viaRelationship, depth]
      properties:
        entity:
          $ref: "#/components/schemas/GraphEntity"
        viaRelationship:
          $ref: "#/components/schemas/GraphRelationship"
        depth:
          type: integer
          description: How many hops from the root entity

    GraphImpactResult:
      type: object
      required: [root, impacted, maxDepthReached]
      properties:
        root:
          $ref: "#/components/schemas/GraphEntity"
        impacted:
          type: array
          items:
            $ref: "#/components/schemas/GraphImpactHop"
        maxDepthReached:
          type: integer

    GraphPathStep:
      type: object
      required: [entity]
      properties:
        entity:
          $ref: "#/components/schemas/GraphEntity"
        relationship:
          $ref: "#/components/schemas/GraphRelationship"

    GraphPathResult:
      type: object
      required: [found]
      properties:
        found:
          type: boolean
        path:
          type: array
          items:
            $ref: "#/components/schemas/GraphPathStep"
        length:
          type: integer

    GraphCentralityScore:
      type: object
      required: [entityId, entityName, entityType, inDegree, outDegree, totalDegree]
      properties:
        entityId:
          type: string
        entityName:
          type: string
        entityType:
          type: string
        inDegree:
          type: integer
        outDegree:
          type: integer
        totalDegree:
          type: integer

    # KG-03: per-layer stats shape used inside LayeredGraphSummary
    GraphSummaryLayer:
      type: object
      required: [entityCount, relationshipCount, avgConfidence]
      properties:
        entityCount:
          type: integer
        relationshipCount:
          type: integer
        avgConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    # KG-03: full layered provenance summary returned alongside GraphSummary
    LayeredGraphSummary:
      type: object
      required: [byLayer, byEdgeType, avgConfidenceOverall, documentedEntityCount, undocumentedEntityCount]
      properties:
        byLayer:
          type: object
          required: [structural, heuristic, runtime]
          properties:
            structural:
              $ref: "#/components/schemas/GraphSummaryLayer"
            heuristic:
              $ref: "#/components/schemas/GraphSummaryLayer"
            runtime:
              $ref: "#/components/schemas/GraphSummaryLayer"
        byEdgeType:
          type: object
          description: >-
            Edge-type distribution across the graph (e.g. imports=12, calls=4).
          additionalProperties:
            type: integer
        avgConfidenceOverall:
          type: number
          format: float
        documentedEntityCount:
          type: integer
        undocumentedEntityCount:
          type: integer

    GraphSummary:
      type: object
      required: [projectId, entityCount, relationshipCount, entitiesByType, relationsByType, topConnected, avgDegree, isolatedCount, clusterCount]
      properties:
        projectId:
          type: string
        entityCount:
          type: integer
        relationshipCount:
          type: integer
        entitiesByType:
          type: object
          additionalProperties:
            type: integer
        relationsByType:
          type: object
          additionalProperties:
            type: integer
        topConnected:
          type: array
          items:
            $ref: "#/components/schemas/GraphCentralityScore"
        avgDegree:
          type: number
          format: float
        isolatedCount:
          type: integer
        clusterCount:
          type: integer
        # KG-03: provenance-layered breakdown — always present on GET /graph/summary
        layered:
          $ref: "#/components/schemas/LayeredGraphSummary"

    # ─── Knowledge Graph 2.0 — layered/neighborhood/evidence schemas ──────────

    GraphSubgraphFilters:
      type: object
      properties:
        edgeTypes:
          type: array
          items:
            type: string
        minConfidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        sourceTypes:
          type: array
          items:
            type: string
        semanticTags:
          type: array
          items:
            type: string
        observedOnly:
          type: boolean
        heuristicOnly:
          type: boolean

    GraphLayerCounts:
      type: object
      required: [entityCount, relationshipCount]
      properties:
        entityCount:
          type: integer
        relationshipCount:
          type: integer

    GraphSubgraph:
      type: object
      required: [entities, relationships, filters, layered]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/GraphRelationship"
        filters:
          $ref: "#/components/schemas/GraphSubgraphFilters"
        layered:
          type: object
          required: [structural, heuristic, runtime]
          properties:
            structural:
              $ref: "#/components/schemas/GraphLayerCounts"
            heuristic:
              $ref: "#/components/schemas/GraphLayerCounts"
            runtime:
              $ref: "#/components/schemas/GraphLayerCounts"

    GraphSemanticNeighborhood:
      type: object
      required: [root, entities, relationships]
      properties:
        root:
          $ref: "#/components/schemas/GraphEntity"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/GraphRelationship"

    GraphEvidenceBundle:
      type: object
      required: [relationship, evidence]
      properties:
        relationship:
          $ref: "#/components/schemas/GraphRelationship"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/GraphEvidence"

    GraphEvidenceResponse:
      type: object
      required: [entity, evidence]
      properties:
        entity:
          $ref: "#/components/schemas/GraphEntity"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/GraphEvidenceBundle"

    GraphRuntimeSubgraph:
      type: object
      required: [entities, relationships]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/GraphRelationship"

    # ─── Plugin request bodies ─────────────────────────────────────────────────
    PluginProjectRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string

    EvaluateRuleRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string

    # ─── Plugin ────────────────────────────────────────────────────────────────
    Plugin:
      type: object
      required: [id, name, version, enabled, capabilities]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [analyzer, rules, prompts, verifier, reporter]
        supportedLanguages:
          type: array
          items:
            type: string

    # ─── Discovery ─────────────────────────────────────────────────────────────
    SourceType:
      type: string
      enum:
        - LOCAL_FOLDER
        - WORKSPACE_PROJECT
        - GIT_REPOSITORY
        - ARCHIVE_UPLOAD
        - REMOTE_FILESYSTEM
        - DOCKER_VOLUME

    DiscoverySourceConfig:
      type: object
      description: Source-specific configuration. Required fields depend on sourceType.
      properties:
        path:
          type: string
          description: Absolute path to the project directory (LOCAL_FOLDER)
        url:
          type: string
          description: Git repository URL (GIT_REPOSITORY)
        branch:
          type: string
          description: Branch to checkout; defaults to the remote HEAD (GIT_REPOSITORY)
        credentials:
          type: object
          description: Repository credentials for private repos (GIT_REPOSITORY)
          required:
            - username
            - token
          properties:
            username:
              type: string
            token:
              type: string
        uploadId:
          type: string
          description: Upload session ID from a prior file upload (ARCHIVE_UPLOAD)
        projectId:
          type: string
          description: ID of an existing registered project (WORKSPACE_PROJECT)

    DiscoveryOptions:
      type: object
      properties:
        skipRules:
          type: boolean
          default: false
        skipGraph:
          type: boolean
          default: false
        maxDepth:
          type: integer
          minimum: 1
          maximum: 20
        includeTests:
          type: boolean
          default: true

    DiscoverySourceCapability:
      type: object
      required: [sourceType, label, description, available]
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceType"
        label:
          type: string
        description:
          type: string
        available:
          type: boolean
        icon:
          type: string
        requiredConfig:
          type: array
          items:
            type: string
        notes:
          type: string

    StartDiscoveryInput:
      type: object
      required: [sourceType, sourceConfig]
      additionalProperties: false
      properties:
        sourceType:
          $ref: "#/components/schemas/SourceType"
        sourceConfig:
          $ref: "#/components/schemas/DiscoverySourceConfig"
        options:
          $ref: "#/components/schemas/DiscoveryOptions"

    ImportProjectInput:
      type: object
      required: [discoveryId]
      additionalProperties: false
      properties:
        discoveryId:
          type: string
        overrides:
          type: object
          properties:
            name:
              type: string
            language:
              type: string
            framework:
              type: string
            description:
              type: string

    DiscoveryStepItem:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pending, running, done, error]
        durationMs:
          type: ["integer", "null"]

    DiscoverySessionStatus:
      type: object
      required: [id, status, progress, steps, startedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, discovering, ready, imported, error]
        progress:
          type: integer
        currentStep:
          type: ["string", "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryStepItem"
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
        importedProjectId:
          type: ["string", "null"]

    DiscoveryRuleViolationItem:
      type: object
      required: [code, title, severity, count]
      properties:
        code:
          type: string
        title:
          type: string
        severity:
          type: string
        count:
          type: integer

    DiscoveryGraphSummaryData:
      type: object
      required: [entityCount, relationshipCount, entitiesByType, filesByLanguage]
      properties:
        entityCount:
          type: integer
        relationshipCount:
          type: integer
        entitiesByType:
          type: object
          additionalProperties:
            type: integer
        filesByLanguage:
          type: object
          additionalProperties:
            type: integer

    DiscoveryReport:
      type: object
      required:
        - id
        - detectedName
        - detectedLanguage
        - detectedLanguages
        - isMonorepo
        - hasDocker
        - hasOpenApi
        - packageCount
        - moduleCount
        - repoSizeBytes
        - detectedApis
        - detectedRisks
        - qualityScore
        - confidenceScore
        - graphSummary
        - ruleViolations
      properties:
        id:
          type: string
        detectedName:
          type: string
        detectedLanguage:
          type: string
        detectedLanguages:
          type: array
          items:
            type: string
        detectedFramework:
          type: ["string", "null"]
        detectedRuntime:
          type: ["string", "null"]
        detectedPackageManager:
          type: ["string", "null"]
        detectedArchitecture:
          type: ["string", "null"]
        detectedDb:
          type: ["string", "null"]
        detectedOrm:
          type: ["string", "null"]
        detectedTestFramework:
          type: ["string", "null"]
        detectedBuildTool:
          type: ["string", "null"]
        detectedCi:
          type: ["string", "null"]
        isMonorepo:
          type: boolean
        hasDocker:
          type: boolean
        hasOpenApi:
          type: boolean
        packageCount:
          type: integer
        moduleCount:
          type: integer
        repoSizeBytes:
          type: integer
        detectedApis:
          type: array
          items:
            type: string
        detectedRisks:
          type: array
          items:
            type: string
        qualityScore:
          type: number
        confidenceScore:
          type: number
        graphSummary:
          $ref: "#/components/schemas/DiscoveryGraphSummaryData"
        ruleViolations:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryRuleViolationItem"

    # ─── Dashboard ─────────────────────────────────────────────────────────────
    DashboardOverview:
      type: object
      required: [projectCount, activeTaskCount, completedTaskCount, failedTaskCount, recentEvents, projectScores]
      properties:
        projectCount:
          type: integer
        activeTaskCount:
          type: integer
        completedTaskCount:
          type: integer
        failedTaskCount:
          type: integer
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        projectScores:
          type: array
          items:
            type: object
            required: [projectId, projectName, score, trend]
            properties:
              projectId:
                type: string
              projectName:
                type: string
              score:
                type: number
              trend:
                type: string
                enum: [improving, stable, declining]
        taskStatusBreakdown:
          type: object
          additionalProperties:
            type: integer
        topRules:
          type: array
          items:
            type: object
            required: [ruleId, code, title, hitCount]
            properties:
              ruleId:
                type: string
              code:
                type: string
              title:
                type: string
              hitCount:
                type: integer
