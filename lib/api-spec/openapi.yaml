          required: true
          schema:
            type: string
            description: UUID of the AI execution
      responses:
        "200":
          description: Durable execution status
          content:
            application/json:
              schema:
                type: object
                required: [id, status, flightState, evidenceVerdict, proofRequired, checkpoint, checkpointVersion, resumable]
                properties:
                  id: { type: string, description: UUID of the AI execution }
                  projectId: { type: string }
                  sessionId: { type: string, description: UUID of the chat session }
                  objective:
                    type: object
                    nullable: true
                    additionalProperties: true
                    description: Server-retained objective contract used to scope this execution
                  linkedTaskId: { type: string, nullable: true }
                  buildPlanMessageId: { type: string, nullable: true }
                  attempt: { type: integer, description: Current bounded execution attempt }
                  projectRevision:
                    type: string
                    nullable: true
                    description: Workspace revision captured when this execution began
                  status:
                    type: string
                    enum: [queued, running, paused, cancelling, cancelled, completed, failed]
                  flightState:
                    type: string
                    enum: [BUILDING, VALIDATING, REPAIRING, READY_FOR_REVIEW, BLOCKED, APPLIED, COMMITTED, PUSHED, CANCELLED, COMPLETED]
                    description: Unified server-derived Code Flight Deck lifecycle state
                  evidenceVerdict:
                    type: string
                    enum: [PROVEN, PARTIAL, UNAVAILABLE, BLOCKED, NOT_RECORDED]
                    description: Evidence confidence for the durable execution; absence of proof never implies success
                  proofRequired:
                    type: boolean
                    description: Whether this execution is a Code Flight Deck operation that requires accepted engineering evidence
                  evidenceReason:
                    type: string
                    nullable: true
                    description: Bounded explanation for the current evidence verdict
                  terminalReason:
                    type: string
                    nullable: true
                    description: Safe reason explaining why the execution stopped or is blocked
                  checkpoint: { type: object, additionalProperties: true }
                  checkpointVersion: { type: integer }
                  finalMessageId: { type: string, nullable: true }
                  proposalId: { type: string, nullable: true }
                  operationId: { type: string, nullable: true, description: Stable operation trace identity used by Apply, Commit, and Push }
                  error: { type: string, nullable: true }
                  resumable: { type: boolean }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
                  startedAt: { type: string, format: date-time, nullable: true }
                  completedAt: { type: string, format: date-time, nullable: true }
        "404":
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
