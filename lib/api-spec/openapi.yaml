            type: string
            description: UUID of the AI execution
      responses:
        "200":
          description: Redacted execution audit JSON, suitable for preview or download
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [format, exportedAt, execution, operationEvidence, timeline, validations, affectedFiles, redaction]
                properties:
                  format: { type: string, example: engineeringos.execution-audit.v1 }
                  exportedAt: { type: string, format: date-time }
                  execution: { type: object, additionalProperties: true }
                  operationEvidence:
                    $ref: "#/components/schemas/OperationEvidenceProjection"
                  timeline: { type: array, items: { type: object, additionalProperties: true } }
