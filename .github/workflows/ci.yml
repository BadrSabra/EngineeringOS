name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PR-5: A dedicated fast-path job runs codegen:check + typecheck whenever the
# OpenAPI contract or one of its focused dashboard consumers changes. It
# completes in ~60 s and catches drift before the full test suite (which takes
# several minutes) even starts. The full job always runs in parallel so neither
# blocks the other.
jobs:
  contract-trigger:
    name: Detect contract changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contract:
              - 'lib/api-spec/openapi.yaml'
              - 'lib/api-zod/src/generated/**'
              - 'lib/api-client-react/src/generated/**'
              - 'lib/api-client-react/src/use-ai-chat-stream.ts'
              - 'scripts/validate-dashboard-client-contract.mjs'
              - 'artifacts/dashboard/src/components/GitPanel.tsx'
              - 'artifacts/dashboard/src/pages/AiChat.tsx'
              - 'artifacts/dashboard/src/pages/Dashboard.tsx'
              - 'artifacts/dashboard/src/pages/DiscoverProjectWizard.tsx'
              - 'artifacts/dashboard/src/pages/Events.tsx'
              - 'artifacts/dashboard/src/pages/FlightDeck.tsx'
              - 'artifacts/dashboard/src/pages/Graph.tsx'
              - 'artifacts/dashboard/src/pages/Metrics.tsx'
              - 'artifacts/dashboard/src/pages/MissionControl.tsx'
              - 'artifacts/dashboard/src/pages/ProjectDetail.tsx'
              - 'artifacts/dashboard/src/pages/Projects.tsx'
              - 'artifacts/dashboard/src/pages/Rules.tsx'
              - 'artifacts/dashboard/src/pages/Tasks.tsx'
              - 'artifacts/dashboard/src/pages/Workflows.tsx'

  contract-drift:
    name: OpenAPI contract drift guard
    needs: contract-trigger
    runs-on: ubuntu-latest
    # Pull-request file names come from paths-filter; changed_files in the
    # GitHub event is only a numeric count. Pushes always run the fast path.
    if: github.event_name == 'push' || needs.contract-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        run: pnpm run validate:github-workflows

      # PR-01: Validate that openapi.yaml parses cleanly BEFORE attempting codegen.
      # A YAML syntax error produces an opaque Orval failure; this gives a clear message.
      - name: Parse-check OpenAPI spec
        run: pnpm --filter @workspace/scripts run parse-check-spec

      # PR-5: Run codegen then check whether any generated file changed.
      # Fails immediately so developers get a tight feedback loop without
      # waiting for the full test suite.
      - name: Check codegen drift (fast-path)
        run: pnpm run codegen:check

      - name: Type-check generated surfaces
        run: pnpm run typecheck:libs

      # Keep the clean client declaration + dashboard contract guard in the
      # fast path so stale dashboard-facing API types fail with the spec job.
      - name: Validate API client and dashboard contract
        run: pnpm run validate:dashboard-client-contract

      - name: Verify dashboard contract trigger policy
        run: pnpm run test:dashboard-contract-trigger

  validate:
    name: Validate (codegen drift + typecheck + tests)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engineeringos_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineeringos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineeringos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate GitHub Actions workflows
        run: pnpm run validate:github-workflows

      # PR-01: Validate that openapi.yaml parses cleanly before codegen.
      - name: Parse-check OpenAPI spec
        run: pnpm --filter @workspace/scripts run parse-check-spec

      # PR-5 / PR-06: fail the build if generated files are out of sync with
      # openapi.yaml. This catches the case where a developer edits the spec
      # but forgets to run `pnpm codegen` before committing.
      - name: Check codegen drift
        run: pnpm run codegen:check

      - name: Type-check all packages
        run: pnpm run typecheck

      - name: Provision test database schema
        run: pnpm --filter @workspace/db run push

      - name: Run tests
        run: pnpm run test
