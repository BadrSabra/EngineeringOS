name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_environment:
        description: "Protected environment approved for release validation"
        required: true
        type: environment

# PR-5: A dedicated fast-path job runs codegen:check + typecheck whenever the
# OpenAPI contract or an explicitly selected production Dashboard API consumer
# changes. It completes in ~60 s and catches drift before the full test suite
# (which takes several minutes) even starts. The full job always runs in
# parallel so neither blocks the other.
jobs:
  contract-trigger:
    name: Detect contract changes and verify policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contract:
              - 'lib/api-spec/openapi.yaml'
              - 'lib/api-zod/src/generated/**'
              - 'lib/api-client-react/src/generated/**'
              - 'lib/api-client-react/src/use-ai-chat-stream.ts'
              - 'scripts/validate-dashboard-client-contract.mjs'
              - 'artifacts/dashboard/src/App.tsx'
              - 'artifacts/dashboard/src/components/CapabilityGapNotice.tsx'
              - 'artifacts/dashboard/src/components/GitPanel.tsx'
              - 'artifacts/dashboard/src/components/RecipeProgressPanel.tsx'
              - 'artifacts/dashboard/src/lib/use-recipe-stream.ts'
              - 'artifacts/dashboard/src/pages/AiChat.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/delivery-proof.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/evidence-panels.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/execution-proof.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/execution-trace.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/forensic-evidence-card.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/message-bubble.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/pending-changes.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/project-query.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/provider-key-cards.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/provider-runtime.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/stream-errors.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/stream-intent.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/stream-lifecycle.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/stream-observations.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/stream-terminal.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/structured-results.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/task-result-panel.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/trace-parsing.tsx'
              - 'artifacts/dashboard/src/pages/ai-chat/types.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/use-cross-tab-sync.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/use-live-activity.ts'
              - 'artifacts/dashboard/src/pages/ai-chat/use-provider-metrics.ts'
              - 'artifacts/dashboard/src/pages/Dashboard.tsx'
              - 'artifacts/dashboard/src/pages/DiscoverProjectWizard.tsx'
              - 'artifacts/dashboard/src/pages/Events.tsx'
              - 'artifacts/dashboard/src/pages/FlightDeck.tsx'
              - 'artifacts/dashboard/src/pages/Graph.tsx'
              - 'artifacts/dashboard/src/pages/Metrics.tsx'
              - 'artifacts/dashboard/src/pages/MissionControl.tsx'
              - 'artifacts/dashboard/src/pages/ProjectDetail.tsx'
              - 'artifacts/dashboard/src/pages/Projects.tsx'
              - 'artifacts/dashboard/src/pages/Rules.tsx'
              - 'artifacts/dashboard/src/pages/Tasks.tsx'
              - 'artifacts/dashboard/src/pages/Workflows.tsx'
              - 'artifacts/dashboard/src/components/BrowserValidationProfilesPanel.tsx'
              - 'artifacts/dashboard/src/components/ChatSessionMissionHandoffs.tsx'
              - 'artifacts/dashboard/src/components/DashboardWorkSummary.tsx'
              - 'artifacts/dashboard/src/components/EvidenceGraphPanel.tsx'
              - 'artifacts/dashboard/src/components/ExecutionProjectionPanel.tsx'
              - 'artifacts/dashboard/src/components/ProjectAiBudgetPanel.tsx'
              - 'artifacts/dashboard/src/components/ProjectPluginsPanel.tsx'
              - 'artifacts/dashboard/src/components/RuleDetailActions.tsx'
              - 'artifacts/dashboard/src/components/WorldTransitionTimeline.tsx'
              - 'artifacts/dashboard/src/components/mission-state.ts'
              - 'artifacts/dashboard/src/components/result-details.ts'
              - 'artifacts/dashboard/src/lib/execution-recovery-view.ts'
              - 'artifacts/dashboard/src/lib/ai-missions.ts'
              - 'artifacts/dashboard/src/pages/GeneralChat.tsx'
              - 'artifacts/dashboard/src/pages/Missions.tsx'
              - 'artifacts/dashboard/src/pages/SkillRegistry.tsx'

      - name: Verify Dashboard contract trigger policy
        run: node --test scripts/dashboard-contract-trigger.test.mjs

  contract-drift:
    name: OpenAPI contract drift guard
    needs: contract-trigger
    runs-on: ubuntu-latest
    # Pull-request file names come from paths-filter; changed_files in the
    # GitHub event is only a numeric count. Pushes always run the fast path.
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'push' ||
           (needs.contract-trigger.result == 'success' &&
            needs.contract-trigger.outputs.should_run == 'true')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject tracked private-key material
        run: pnpm run security:reject-private-keys

      - name: Validate GitHub Actions workflows
        run: pnpm run validate:github-workflows

      # PR-01: Validate that openapi.yaml parses cleanly BEFORE attempting codegen.
      # A YAML syntax error produces an opaque Orval failure; this gives a clear message.
      - name: Parse-check OpenAPI spec
        run: pnpm --filter @workspace/scripts run parse-check-spec

      # PR-5: Run codegen then check whether any generated file changed.
      # Fails immediately so developers get a tight feedback loop without
      # waiting for the full test suite.
      - name: Check codegen drift (fast-path)
        run: pnpm run codegen:check

      - name: Type-check generated surfaces
        run: pnpm run typecheck:libs

      # Keep the clean client declaration + dashboard contract guard in the
      # fast path so stale dashboard-facing API types fail with the spec job.
      - name: Validate API client and dashboard contract
        run: pnpm run validate:dashboard-client-contract

  validate:
    name: Validate (codegen drift + typecheck + tests)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:55487/engineeringos_test
      SCHEMA_CANARY_MAINTENANCE_DATABASE_URL: postgresql://runner:runner@127.0.0.1:55487/postgres
      WORKSPACE_PATH: /home/runner/workspace
    defaults:
      run:
        working-directory: /home/runner/workspace
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: engineeringos_test
        ports:
          - 55487:5432
        options: >-
          --health-cmd "pg_isready -U runner -d engineeringos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin the trusted base to the local main ref
        working-directory: ${{ github.workspace }}
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${TRUSTED_BASE_SHA}^{commit}"
          git update-ref refs/heads/main "$TRUSTED_BASE_SHA"
          test "$(git rev-parse --verify 'main^{commit}')" = "$TRUSTED_BASE_SHA"

      - name: Stage repository under the admitted workspace root
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test ! -e /home/runner/workspace
          mkdir -m 700 /home/runner/workspace
          cp -a "$GITHUB_WORKSPACE"/. /home/runner/workspace/

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep workflow-only Vite requirements out of the root build contract.
      # This test also verifies the public Clerk bundle boundary and that
      # runtime commands still fail fast when their workflow variables are
      # absent.
      - name: Validate workflow-free root build contract
        run: pnpm run validate:root-build-contract

      - name: Reject tracked private-key material
        run: pnpm run security:reject-private-keys

      - name: Validate GitHub Actions workflows
        run: pnpm run validate:github-workflows

      # PR-01: Validate that openapi.yaml parses cleanly before codegen.
      - name: Parse-check OpenAPI spec
        run: pnpm --filter @workspace/scripts run parse-check-spec

      # PR-5 / PR-06: fail the build if generated files are out of sync with
      # openapi.yaml. This catches the case where a developer edits the spec
      # but forgets to run `pnpm codegen` before committing.
      - name: Check codegen drift
        run: pnpm run codegen:check

      - name: Type-check all packages
        run: pnpm run typecheck

      - name: Prove legacy memory schema delivery
        run: pnpm --filter @workspace/db run schema:canary

      - name: Apply and verify test database schema
        run: pnpm run db:schema:apply

      - name: Install Chromium for browser-backed tests
        run: pnpm --filter @workspace/dashboard exec playwright install --with-deps chromium

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          admitted_workspace_root="$(realpath "$WORKSPACE_PATH")"
          test "$(pwd -P)" = "$admitted_workspace_root"
          export WORKSPACE_RUNTIME_ALLOWED_ROOTS_JSON="[\"$admitted_workspace_root\",\"/tmp\"]"
          control_directory="${RUNNER_TEMP}/eos-supervisor-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$control_directory"
          chgrp "$(id -g)" "$control_directory"
          chmod 2710 "$control_directory"
          export WORKSPACE_RUNTIME_SUPERVISOR_SOCKET_PATH="$control_directory/control.sock"
          export WORKSPACE_RUNTIME_SUPERVISOR_API_GID="$(id -g)"
          export WORKSPACE_RUNTIME_SUPERVISOR_CANDIDATE_UID="$(id -u)"
          export WORKSPACE_RUNTIME_SUPERVISOR_CANDIDATE_GID="$(id -g)"
          export NODE_ENV=test
          export WORKSPACE_RUNTIME_SUPERVISOR_TEST_MODE=1
          mapfile -t key_material < <(
            node --input-type=module -e '
              import { generateKeyPairSync } from "node:crypto";
              const pair = generateKeyPairSync("ed25519");
              console.log(pair.privateKey.export({format:"der",type:"pkcs8"}).toString("base64"));
              console.log(pair.publicKey.export({format:"der",type:"spki"}).toString("base64"));
            '
          )
          signing_private_key="${key_material[0]}"
          verify_public_key="${key_material[1]}"
          test -n "$signing_private_key"
          test -n "$verify_public_key"
          export WORKSPACE_RUNTIME_SUPERVISOR_SIGNING_PRIVATE_KEY_B64="$signing_private_key"
          export WORKSPACE_RUNTIME_SUPERVISOR_VERIFY_PUBLIC_KEY_B64="$verify_public_key"
          supervisor_log="${RUNNER_TEMP}/workspace-runtime-supervisor.log"
          env -u WORKSPACE_RUNTIME_SUPERVISOR_SIGNING_PRIVATE_KEY_B64 \
            node scripts/workspace-runtime-supervisor.mjs >"$supervisor_log" 2>&1 &
          supervisor_pid=$!
          cleanup_supervisor() {
            if kill -0 "$supervisor_pid" 2>/dev/null; then
              kill -TERM "$supervisor_pid" 2>/dev/null || true
              for _ in $(seq 1 25); do
                if ! kill -0 "$supervisor_pid" 2>/dev/null; then break; fi
                sleep 0.2
              done
              if kill -0 "$supervisor_pid" 2>/dev/null; then
                kill -KILL "$supervisor_pid" 2>/dev/null || true
              fi
            fi
            wait "$supervisor_pid" 2>/dev/null || true
          }
          trap cleanup_supervisor EXIT
          ready=false
          for _ in $(seq 1 50); do
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              cat "$supervisor_log"
              exit 1
            fi
            if [ -S "$WORKSPACE_RUNTIME_SUPERVISOR_SOCKET_PATH" ]; then
              ready=true
              break
            fi
            sleep 0.2
          done
          if [ "$ready" != true ]; then
            cat "$supervisor_log"
            echo "Workspace runtime supervisor did not create its protected Unix socket." >&2
            exit 1
          fi
          pnpm run test

      - name: Prove task acceptance after HTTP response loss
        shell: bash
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          pnpm --filter @workspace/api-server run test:task-route-acceptance-response-loss

      - name: Prove PostgreSQL-backed runtime process recovery
        shell: bash
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          pnpm --filter @workspace/api-server exec vitest run src/lib/workspace-runtime-store.test.ts
        env:
          RUN_RUNTIME_CONCURRENT_START_PROCESS: "1"
          RUN_RUNTIME_ADOPTION_PROCESS_RECOVERY: "1"
          RUN_RUNTIME_START_RESPONSE_LOSS_RECOVERY: "1"
          RUN_RUNTIME_STARTUP_RECOVERY: "1"

  release-validation:
    name: Release validation
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_environment == 'release-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release-validation
    concurrency:
      group: release-validation-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engineeringos_test
      PLAYWRIGHT_OUTPUT_DIR: test-results/dashboard-journey
      DASHBOARD_E2E_TEARDOWN_ARTIFACT_PATH: test-results/dashboard-journey/release-teardown.json
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engineeringos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d engineeringos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject tracked private-key material
        run: pnpm run security:reject-private-keys

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply and verify release database schema
        run: pnpm run db:schema:apply

      - name: Run controlled release validation
        timeout-minutes: 20
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >-
          APP_ORIGINS="http://127.0.0.1:23184"
          RELEASE_VALIDATION_WAIT_FOR_LOCK=1
          DASHBOARD_E2E_EXECUTABLE_PATH="$(command -v chromium)"
          DASHBOARD_E2E_SKIP_API_CONTRACTS=1
          pnpm run validate:dashboard-journey

      - name: Upload release teardown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-teardown
          path: test-results/dashboard-journey/release-teardown.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-diagnostics
          path: |
            test-results/dashboard-journey/**
            artifacts/dashboard/test-results/**
            test-results/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize retained release diagnostics
        if: always()
        shell: bash
        env:
          TEARDOWN_ARTIFACT: test-results/dashboard-journey/release-teardown.json
          TEARDOWN_ARTIFACT_NAME: release-validation-${{ github.run_id }}-teardown
        run: |
          {
            echo "## Release validation diagnostics"
            echo
            echo "Validation run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "Retained teardown evidence: [$TEARDOWN_ARTIFACT_NAME](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
            echo
            if [[ -f "$TEARDOWN_ARTIFACT" ]]; then
              echo "### Teardown coverage"
              jq -r '.services[] | "- \(.owningService): port \(.configuredPort // "n/a"), process group \(.processGroup // "n/a"), surviving descendants \((.finalSurvivingPids | length)), cleanup \(.cleanupOutcome)"' "$TEARDOWN_ARTIFACT"
            else
              echo "The teardown evidence file was not produced; see the job log for the failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
